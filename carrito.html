<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">
  <link rel="stylesheet" href="generalstyles.css">
  <title>Carrito</title>
</head>
<body class="bg-light">

  <div id="navbar"></div>

  <div class="container py-5">
    <h2 class="fw-bold mb-4"><i class="bi bi-cart3 me-2"></i>Mi Carrito</h2>

    <div class="row g-4">
      <!-- Lista de productos -->
      <div class="col-lg-8">
        <div id="listaCarrito"></div>
      </div>

      <!-- Resumen del pedido -->
      <div class="col-lg-4">
        <div class="card shadow-sm border-0 sticky-top" style="top: 20px;">
          <div class="card-body p-4">
            <h5 class="fw-bold mb-3">Resumen del pedido</h5>
            <hr>
            <div class="d-flex justify-content-between mb-2 text-muted">
              <span>Subtotal</span>
              <span id="subtotal">$0</span>
            </div>
            <div class="d-flex justify-content-between mb-3 text-muted">
              <span>Envío</span>
              <span class="text-success">Gratis</span>
            </div>
            <hr>
            <div class="d-flex justify-content-between fw-bold fs-5 mb-4">
              <span>Total</span>
              <span id="total">$0</span>
            </div>
            <button class="btn btn-dark w-100 mb-2" onclick="checkout()">
              <i class="bi bi-lock me-2"></i>Finalizar compra
            </button>
            <button class="btn btn-outline-secondary w-100 mb-2" onclick="volverHome()">
              <i class="bi bi-arrow-left me-2"></i>Seguir comprando
            </button>
            <button class="btn btn-outline-danger w-100" onclick="vaciarCarrito()">
              <i class="bi bi-trash me-2"></i>Vaciar carrito
            </button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="navbar.js"></script>
  <script>
    fetch("navbar.html")
      .then(res => res.text())
      .then(data => {
        document.getElementById('navbar').innerHTML = data;
        iniciarNavbar();
      });
  </script>
  <script src="carrito.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
